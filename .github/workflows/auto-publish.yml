name: Auto publish reviewed articles

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of articles to attempt (1-10)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Generate, review and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.count || '3' }}
        run: python scripts/auto_publish.py
      - name: Commit published articles
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sitemap.xml articles/
            git commit -m "Publish AI-reviewed encyclopedia articles"
            git push
          else
            echo "No articles passed review; nothing to publish."
          fi
